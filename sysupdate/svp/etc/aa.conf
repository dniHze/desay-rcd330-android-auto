# Android Auto defaults (system install). Read by /svp/etc/aa_run.sh as KEY=VALUE lines, never
# sourced. Override any of them in /storage/data/data/aa/aa.conf (same format). Keys are AA_*
# (and DEBUG); values may use letters, digits and _ . , : / = + - only.

# 0: the stock CarLife service, no Android Auto, no rebrand (from the next boot).
AA_ENABLE=1
# AppConnect shows Android Auto instead of Baidu CarLife (bind mounts, md5-guarded).
AA_REBRAND=1
# UI languages beyond Chinese and English (our libUIPublic.so, chosen in Settings > Language).
# 0: the stock texts and language list from the next boot (an "aa-lang-off" card does the same).
AA_LANG=1
# Settings > Appearance (the colour theme and the start screen). 0: both back to the car's coding
# (an "aa-appearance-off" card does the same).
AA_APPEARANCE=1
# Logs onto a card or stick with an aa-logs folder: refreshed this often while it stays in (s;
# 0: once per insertion), and the newest this many boot folders (aa-logs/log<NNNN>) kept.
AA_LOG_REFRESH_SECS=60
AA_LOG_KEEP=10
# More detail in the logs: receiver protocol log, shim debug lines, GStreamer warnings.
AA_DEBUG=0
# Where the output of the three processes goes: syslog (/var/log/messages), console, none.
AA_LOG=syslog

# Supervision: a service started more than AA_MAX_STARTS times within 60 s is given up (the
# shim: the stock CarLife service takes over until the next boot; the receiver and the bridge
# wait 30 s between starts). More than AA_BOOTLOOP_MAX boots in a row that end within
# AA_STABLE_SECS, other than by a switch-off (the shim reports those): one boot with the stock
# service, then Android Auto again.
AA_MAX_STARTS=5
AA_BOOTLOOP_MAX=3
AA_STABLE_SECS=90

# Video: the sink keeps the decoder's padded picture; the shim crops it on the ILM surface.
AA_VIDEO_SINK=waylandsink2

# Shim (aa-carlife-shim): the car's services it uses, and the AA features they give.
AA_SHIM_CONNECT_TIMEOUT_MS=30000
# CAN: night mode, gear, speed (0: off).
AA_CAN_PORT=30705
# Bluetooth: pair the phone through the car's own pairing; drop the phone's A2DP while AA plays.
AA_BT_PAIRING=1
AA_BT_A2DP_DROP=1
# Calls: the car's phone screen stays behind AA during a call.
AA_CALL_FIX=1
# AppConnect code fixes in memory, if the AppConnect running lacks them (the rebrand has them).
AA_APPC_PATCH=1
# Power: AA media pauses at switch-off and resumes at switch-on (0: off).
AA_POWER_LISTEN_PORT=30202
# Last mode: whether AA had the speakers at the last switch-off (/storage/data/data/aa/lastmode).
AA_LAST_MODE=1

# Receiver (aa-headless).
AA_BT_ADVERTISE=always
# Driving restrictions while the car moves (0: off).
AA_MOVING_RESTRICTIONS=27
# The phone stops sending video this long after AppConnect hides AA (0: never). On the return
# after that, the phone starts its projection again (its Android Auto logo, then the UI): 60 s
# keeps short visits to the car's own apps instant (2 s showed the logo on every return).
AA_HIDE_NATIVE_MS=60000
# What a held seek key sends the phone: nexthold, the key itself held (KEYCODE_MEDIA_NEXT /
# PREVIOUS down at the hold, up at the release: YouTube Music seeks 10 s per hold, Spotify
# changes track); ff,
# KEYCODE_MEDIA_FAST_FORWARD / REWIND steps every AA_SEEK_REPEAT_MS (only players with a
# fast-forward seek: not YouTube Music or Spotify); ffhold, one fast-forward / rewind held until
# the release; longpress, Next / Previous repeated with Android Auto's long_press flag.
AA_SEEK_MODE=nexthold
