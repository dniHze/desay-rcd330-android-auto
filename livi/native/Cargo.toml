# LIVI's workspace (github.com/f-io/LIVI), trimmed to the crates the receiver, livi-aa-headless,
# is built from. See ../README.md.

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "10.5.0"
edition = "2024"
description = "LIVI - Linux In-Vehicle Infotainment"
homepage = "https://f-io.dev"
authors = ["Lasse Heitgres"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Every crate takes libc from here, so all of them follow the 1.0 API.
libc = "1.0.0-alpha.5"
aes = "0.9.4"
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
glib = "0.22.10"
glib-unix = "0.22.8"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
lzokay-native = "0.2.0"
nusb = "0.2.9"
nusb-android = { package = "nusb", git = "https://github.com/f-io/nusb", rev = "10895e1a7c762498324cb1c36a4b67cf60083235" }
prost = "0.14.4"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = "1.54.1"
uuid = "1.29.0"
zbus = { version = "6.2.1", default-features = false }

livi-aa = { path = "crates/livi-aa" }
livi-aa-proto = { path = "crates/livi-aa-proto" }
livi-aa-stack = { path = "crates/livi-aa-stack" }
livi-carlife-shim = { path = "crates/livi-carlife-shim" }
livi-core-proto = { path = "crates/livi-core-proto" }
livi-host-proto = { path = "crates/livi-host-proto" }
livi-session-io = { path = "crates/livi-session-io" }
livi-wifi = { path = "crates/livi-wifi" }
rcf-lite = { path = "crates/rcf-lite" }

[profile.embedded]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
lto = true
